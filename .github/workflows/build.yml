name: Build

on:
  push:
    branches:
      - main
      - sample/*
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/build.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'scripts/setup.sh'
      - 'scripts/setup.ps1'
      - 's2e-core'
      - 'src/**'

jobs:
  build_s2e_win:
    name: Build on Windows VS2022
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_bit: 'BUILD_64BIT=OFF'
            architecture: Win32
            preset: windows-win32-debug
          - build_bit: 'BUILD_64BIT=ON'
            architecture: x64
            preset: windows-x64-debug

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: show tools version
        shell: powershell
        run: |
          cmake --version

      - name: cache extlib
        id: cache-extlib
        uses: actions/cache@v6
        with:
          key: extlib-${{ runner.os }}-${{ hashFiles('./s2e-core/ExtLibraries/**') }}-${{ matrix.build_bit }}
          path: |
            ./ExtLibraries
            ./settings/environment/cspice
            ./settings/environment/space_weather
            ./settings/environment/gravity_field

      - name: build extlib
        if: steps.cache-extlib.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $extlib_dir=(Join-Path (pwd).Path "ExtLibraries")
          $settings_dir=(Resolve-Path "./settings").Path
          cmake -S ./s2e-core/ExtLibraries -B ./build/extlibraries-${{ matrix.architecture }} -G "Visual Studio 17 2022" -A ${{ matrix.architecture }} -DEXT_LIB_DIR="${extlib_dir}" -DSETTINGS_DIR="${settings_dir}" -D${{ matrix.build_bit }}
          cmake --build ./build/extlibraries-${{ matrix.architecture }} --config Debug
          cmake --install ./build/extlibraries-${{ matrix.architecture }} --config Debug

      - name: check extlib
        shell: powershell
        run: |
          ls ExtLibraries/cspice
          ls ExtLibraries/cspice/cspice_msvs*/lib
          ls ExtLibraries/cspice/include
          ls ExtLibraries/nrlmsise00
          ls ExtLibraries/nrlmsise00/lib*
          ls ExtLibraries/nrlmsise00/lib*/libnrlmsise00.lib
          ls ExtLibraries/nrlmsise00/src
          ls settings/environment/cspice/generic_kernels

      - name: build S2E with preset
        shell: powershell
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} --parallel

  build_s2e_linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_bit: 'BUILD_64BIT=OFF'
            preset: linux-x86-debug
            compiler: 'gcc-11 g++-11'
          - build_bit: 'BUILD_64BIT=ON'
            preset: linux-debug
            compiler: 'gcc-11 g++-11'
          - build_bit: 'BUILD_64BIT=OFF'
            preset: linux-x86-debug
            compiler: 'clang clang++'
          - build_bit: 'BUILD_64BIT=ON'
            preset: linux-debug
            compiler: 'clang clang++'

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set compiler
        id: compiler
        run: |
          COMPILER="${{ matrix.compiler }}"
          read -r -a COMPILER <<< "$COMPILER"
          echo "CC=${COMPILER[0]}" >> "$GITHUB_OUTPUT"
          echo "CXX=${COMPILER[1]}" >> "$GITHUB_OUTPUT"

      - name: install deps
        run: |
          # FIXME: temporary install gcc-11 in ubuntu:focal
          if [[ "${{ steps.compiler.outputs.CC }}" =~ "gcc-11" ]]; then
            sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          fi
          sudo apt-get update
          if [[ "${{ steps.compiler.outputs.CC }}" =~ "gcc" ]]; then
            sudo apt-get install -y ${{ steps.compiler.outputs.CC }}-multilib \
                                    ${{ steps.compiler.outputs.CXX }}-multilib
          else
            sudo apt-get install -y gcc-multilib g++-multilib
          fi

      - name: show tools version
        run: |
          cmake --version
          ${{ steps.compiler.outputs.CC  }} --version
          ${{ steps.compiler.outputs.CXX }} --version

      - name: cache extlib
        id: cache-extlib
        uses: actions/cache@v6
        with:
          key: extlib-${{ runner.os }}-${{ hashFiles('./s2e-core/ExtLibraries/**') }}-${{ matrix.build_bit }}
          path: |
            ./ExtLibraries
            ./settings/environment/cspice
            ./settings/environment/space_weather
            ./settings/environment/gravity_field

      - name: build extlib
        if: steps.cache-extlib.outputs.cache-hit != 'true'
        run: |
          cmake -S ./s2e-core/ExtLibraries -B ./build/extlibraries-${{ matrix.preset }} -D${{ matrix.build_bit }} -DEXT_LIB_DIR="$(pwd)/ExtLibraries" -DSETTINGS_DIR="$(realpath ./settings)"
          cmake --build ./build/extlibraries-${{ matrix.preset }} --parallel
          cmake --install ./build/extlibraries-${{ matrix.preset }}
      - name: check extlib
        run: |
          ls ExtLibraries/cspice
          ls ExtLibraries/cspice/cspice_unix*
          ls ExtLibraries/cspice/include
          ls ExtLibraries/nrlmsise00
          ls ExtLibraries/nrlmsise00/lib*
          ls ExtLibraries/nrlmsise00/lib*/libnrlmsise00.a
          ls ExtLibraries/nrlmsise00/src
          ls settings/environment/cspice/generic_kernels

      - name: build
        env:
          CC:  ${{ steps.compiler.outputs.CC  }}
          CXX: ${{ steps.compiler.outputs.CXX }}
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} --parallel
